name: Palladium WebKitGTK

on:
  push:
    branches: [palladium]
    paths:
      - .palladium/**
      - Source/**
      - Tools/**
      - CMakeLists.txt
      - .github/workflows/palladium-runtime.yml
  pull_request:
    branches: [palladium]
  workflow_dispatch:
    inputs:
      revision:
        description: Immutable source commit to build (empty selects this ref)
        type: string
        default: ''
      attempt:
        description: Automatic checkpoint continuation attempt
        type: number
        default: 1

permissions:
  contents: read

concurrency:
  group: palladium-webkit-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      base: ${{ steps.fingerprint.outputs.base }}
      source: ${{ steps.fingerprint.outputs.source }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.revision || github.sha }}
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.palladium/
            /.github/workflows/
      - id: fingerprint
        run: bash .palladium/scripts/fingerprint.sh >> "$GITHUB_OUTPUT"
      - run: |
          for script in .palladium/scripts/*.sh; do bash -n "$script"; done
          python3 -m py_compile .palladium/tests/probe.py
          awk '{ print "/" $2 }' .palladium/source-files.sha256 | git sparse-checkout add --stdin
          sha256sum --check .palladium/source-files.sha256
          PALLADIUM_SOURCE_CHECK_ONLY=1 bash .palladium/scripts/prepare-source.sh "$RUNNER_TEMP/source-check"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source .palladium/pins.env
          gh api "repos/$GITHUB_REPOSITORY/compare/$WEBKIT_UPSTREAM_COMMIT...$(git rev-parse HEAD)?per_page=1" \
            --jq '.files[].filename | select(startswith("Source/") or startswith("Tools/") or . == "CMakeLists.txt")' \
            | LC_ALL=C sort > "$RUNNER_TEMP/native-changes"
          awk '{ print $2 }' .palladium/source-files.sha256 | LC_ALL=C sort > "$RUNNER_TEMP/exported-changes"
          diff -u "$RUNNER_TEMP/native-changes" "$RUNNER_TEMP/exported-changes"

  build:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    permissions:
      contents: read
      actions: write
    outputs:
      state: ${{ steps.build.outputs.state }}
      source_commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.revision || github.sha }}
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.palladium/
            /.github/workflows/
      - id: source
        run: |
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          source .palladium/pins.env
          printf 'ARCH_IMAGE=%s\n' "$ARCH_IMAGE" >> "$GITHUB_ENV"
          printf 'PALLADIUM_CI_DEADLINE=%s\n' "$(( $(date +%s) + 300 * 60 ))" >> "$GITHUB_ENV"
      - run: |
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          timeout 180 sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          sudo docker image prune --all --force > /dev/null
          df -h /
          free -g
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .palladium/state/dependencies
            .palladium/state/complete
            .palladium/state/compile-seconds
            .palladium/state/home/.cache/palladium/webkit-build
            .palladium/state/home/.cache/ccache
            .palladium/state/home/.cache/palladium/librice/LICENSE-*
            .palladium/state/home/.local/share/palladium
            .palladium/state/home/.cargo/bin
          key: webkit-arch-x64-${{ needs.check.outputs.base }}-${{ needs.check.outputs.source }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            webkit-arch-x64-${{ needs.check.outputs.base }}-${{ needs.check.outputs.source }}-
            webkit-arch-x64-${{ needs.check.outputs.base }}-
      - id: build
        run: |
          rm -f .palladium/state/result
          docker run --rm --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
            --security-opt systempaths=unconfined \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            -e PALLADIUM_CI_DEADLINE -e PALLADIUM_HOST_OWNER="$(id -u):$(id -g)" \
            "$ARCH_IMAGE" bash .palladium/scripts/ci-build.sh
          printf 'state=%s\n' "$(cat .palladium/state/result)" >> "$GITHUB_OUTPUT"
      - if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .palladium/state/dependencies
            .palladium/state/complete
            .palladium/state/compile-seconds
            .palladium/state/home/.cache/palladium/webkit-build
            .palladium/state/home/.cache/ccache
            .palladium/state/home/.cache/palladium/librice/LICENSE-*
            .palladium/state/home/.local/share/palladium
            .palladium/state/home/.cargo/bin
          key: webkit-arch-x64-${{ needs.check.outputs.base }}-${{ needs.check.outputs.source }}-${{ github.run_id }}-${{ github.run_attempt }}
      - if: steps.build.outputs.state == 'complete'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: palladium-webkit-arch-x86_64
          path: .palladium/dist/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-test-logs
          path: |
            .palladium/state/test-logs/
            .palladium/state/packaged-test-logs/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - if: steps.build.outputs.state == 'checkpointed'
        env:
          GH_TOKEN: ${{ github.token }}
          ATTEMPT: ${{ inputs.attempt || 1 }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          WORKFLOW_REF: ${{ github.ref_name }}
        run: |
          if [ "$ATTEMPT" -ge 6 ]; then
            echo 'Build still incomplete after six checkpoints. A larger runner is required.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          gh workflow run palladium-runtime.yml --repo "$GITHUB_REPOSITORY" --ref "$WORKFLOW_REF" \
            -f revision="$SOURCE_COMMIT" -f attempt="$(( ATTEMPT + 1 ))"
          echo 'Compilation checkpoint saved. The next attempt has been queued automatically; no runtime has been released.' >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: build
    if: needs.build.outputs.state == 'complete'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: palladium-webkit-arch-x86_64
          path: runtime
      - env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ needs.build.outputs.source_commit }}
        run: |
          cd runtime
          sha256sum --check SHA256SUMS
          source BUILD_INPUTS
          tag="runtime-$WEBKIT_VERSION-${SOURCE_COMMIT:0:12}-$GITHUB_RUN_NUMBER"
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Palladium WebKitGTK $WEBKIT_VERSION for Arch Linux x86_64, built from $SOURCE_COMMIT.

          The build passed source-integrity checks and sandboxed native audio probes, including delayed audio alongside a silent stream. The archive includes source provenance, dependency versions, licenses, and file hashes. SHA256SUMS verifies the download.

          This is a test runtime. A successful two-party Discord call still requires manual verification.
          EOF
          gh release create "$tag" *.tar.zst SHA256SUMS palladium-source.patch BUILD_INPUTS \
            --repo "$GITHUB_REPOSITORY" --target "$SOURCE_COMMIT" --prerelease \
            --title "Palladium WebKitGTK $WEBKIT_VERSION · Arch x86_64" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
